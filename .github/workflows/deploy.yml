name: Deploy backend to Cloudways

# Runs whenever main is updated (a direct push, or a merged PR) and deploys
# the current main to the Cloudways server over SSH, then restarts it under
# pm2. See DEPLOY.md in this repo for the one-time server/secrets setup this
# workflow depends on.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CLOUDWAYS_SSH_HOST }}
          username: ${{ secrets.CLOUDWAYS_SSH_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            # This Cloudways app user can't write to $HOME (only public_html/
            # private_html/tmp), and the system Node (v20) is too old for this
            # repo's TypeScript, so pm2/npm-cache/Node itself all live under
            # private_html via nvm. See DEPLOY.md for how that was set up.
            export NVM_DIR=~/private_html/.nvm
            export NPM_CONFIG_CACHE=~/private_html/.npm-cache
            export PM2_HOME=~/private_html/.pm2
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 22 > /dev/null
            PM2=~/private_html/.npm-global/bin/pm2

            cd "${{ secrets.BE_DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            npm run db:migrate
            "$PM2" describe adplaylist-be > /dev/null \
              && "$PM2" restart adplaylist-be --update-env \
              || "$PM2" start dist/index.js --name adplaylist-be
            "$PM2" save
