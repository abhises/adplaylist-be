# /etc/nginx/sites-available/adplaylist (symlinked into sites-enabled).
# Own file so it never touches the brasq site. TLS lines are added by
# `certbot --nginx -d api.adplaylist.com`.
server {
    server_name api.adplaylist.com;
    include snippets/adplaylist-gzip.conf;

    client_max_body_size 30m;   # uploads allow 25 MB

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # socket.io (live staff notifications)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    http2 on;
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.adplaylist.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.adplaylist.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = api.adplaylist.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.adplaylist.com;
    include snippets/adplaylist-gzip.conf;
    return 404; # managed by Certbot


}